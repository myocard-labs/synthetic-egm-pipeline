# synthegm-generate-dataset — v1 noise-mixed (clean + inline mixer).
#
# Same scope as ``synthegm_v1_baseline.yaml`` with the IAFDB noise
# overlay added inline. The pipeline:
#   1. runs 100 simulations
#   2. builds the clean ClassifierBank in memory (and optionally
#      writes it to disk via output.clean_intermediate)
#   3. samples noise per trace from the iafdb noise bank at the
#      configured SNR distribution
#   4. writes the *noise-mixed* ClassifierBank as the primary output
#
# Output: ../banks/synthegm_v1_noise_mixed.classifier.h5

dataset:
  n_simulations: 25
  master_seed: 42                          # same seed as baseline → same per-sim sampling
  show_progress: true

backend:
  type: finitewave

geometry:
  type: patch_2d
  size_mm: 40.0
  dr_mm: 0.25
  fiber_angle_rad: 0.0
  anisotropy_ratio: 3.0

substrate:
  type: uniform_random_fibrosis
  density_range: [0.0, 0.5]
  fraction_healthy: 0.3

activation:
  type: planar_edge
  fixed_edge: null

electrodes:
  type: centered_grid_2d
  n_rows: 5
  n_cols: 5
  spacing_mm: 2.0
  height_mm_range: [0.2, 1.0]

label_policy:
  type: global_density                     # simpler; calibration runs don't need locality awareness
  threshold: 0.1
  healthy_name: healthy
  fibrotic_name: fibrotic

run:
  trace_duration_ms: 192.0
  output_fs_hz: 1000.0
  ap_time_unit_ms: 1.97
  capture_oversample: 4

output:
  classifier_bank: ../banks/synthegm_v1_noise_mixed_small_gd.classifier.h5
  # Persist the pre-mix clean bank too — useful for ablation studies
  # that compare clean-only vs noise-mixed training without re-running the
  # simulator. Set to null to skip.
  clean_intermediate: ../banks/synthegm_v1_clean_small_gd.classifier.h5
  description: >
    Phase 1 noise-mixed synthetic corpus — same clean dataset as baseline,
    overlaid with iafdb_noise_v1 at 10-25 dB per-trace SNR.

# Inline mixer block. Triggers the noise-mixed output path.
mix:
  # Noise bank produced by iafdb-pipeline; ships from the IAFDB noise-
  # extraction CLI. Resolve relative to this config file's directory.
  noise_bank: ../banks/iafdb_noise_v1.h5
  snr_db_range: [10.0, 25.0]               # uniform per-trace SNR; matches Sánchez 2021
  bandpass_clean: true                     # filter the clean to the clinical bipolar band before mixing
  band_hz: [30.0, 300.0]                   # 30 - 300 Hz; matches noise-extraction band
  master_seed: 0                           # mixer's own RNG seed (independent of simulator's)
  show_progress: true                      # tqdm bar over the mixer loop
  description: >
    Noise-mixed bank vs iafdb_noise_v1 at 10-25 dB SNR.
