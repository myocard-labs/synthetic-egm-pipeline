# synthegm-generate-dataset — v1 noise-mixed (clean + inline mixer).
#
# Same scope as ``synthegm_v1_baseline.yaml`` with the IAFDB noise
# overlay added inline. The pipeline:
#   1. runs 100 simulations
#   2. builds the clean ClassifierBank in memory (and optionally
#      writes it to disk via output.clean_intermediate)
#   3. samples noise per trace from the iafdb noise bank at the
#      configured SNR distribution
#   4. writes the *noise-mixed* ClassifierBank as the primary output
#
# Each ClassifierBank written gets its own theta (synthetic_bank)
# partner, so with clean_intermediate set this run produces four files.
#
# Output: ../banks/synthegm_v1_noise_mixed.classifier.h5

dataset:
  n_simulations: 25
  master_seed: 42                          # same seed as baseline → same per-sim sampling
  show_progress: true

backend:
  type: finitewave
  # Membrane parameterisation: targets + solved knobs + what they
  # measured. Naming it here is what stops ap_time_unit_ms and
  # friends being restated (and going stale) in every config.
  model: af_remodelled_220ms

geometry:
  type: patch_2d
  size_mm: 40.0
  dr_mm: 0.25
  fiber_angle_rad: 0.0
  anisotropy_ratio: 2.0                    # CV_along / CV_across; atrial WALL is ~2:1 (Hansson 1998)

substrate:
  type: uniform_random_fibrosis
  density_range: [0.0, 0.5]
  fraction_healthy: 0.3

activation:
  type: planar_edge
  fixed_edge: null

electrodes:
  type: centered_grid_2d
  n_rows: 5
  n_cols: 5
  spacing_mm: 2.0
  height_mm_range: [0.2, 1.0]

label_policy:
  type: global_density                     # simpler; calibration runs don't need locality awareness
  threshold: 0.1
  healthy_name: healthy
  fibrotic_name: fibrotic

run:
  trace_duration_ms: 192.0
  output_fs_hz: 1000.0
  capture_oversample: 4

# Controlled-position cropping (SEP2). Omit this block for no cropping.
# MATCHES iafdb-pipeline's shipped range, deliberately: the two corpora must
# be windowed the same way or position itself becomes a 'which corpus is
# this' cue. `high` sets the stimulus delay (D = round(p_hi*(T-1)) = 115 ms)
# and `low` sets the tail, together giving a 423 ms capture for a 192 ms
# trace. See docs/simulation_theory.md -> Capture sizing.
activation_position:
  low: 0.4
  high: 0.6
  # seed: 7                                # default: dataset.master_seed

output:
  classifier_bank: ../banks/synthegm_v1_noise_mixed_small_gd.classifier.h5
  # Persist the pre-mix clean bank too — useful for ablation studies
  # that compare clean-only vs noise-mixed training without re-running the
  # simulator. Omit the line entirely to skip.
  #
  # This makes the run write FOUR files: the mixed ClassifierBank + its
  # theta bank, and the clean ClassifierBank + its own theta bank. Every
  # ClassifierBank has exactly one theta partner whose id it names, so
  # each pair joins on its own (D8 / CL-143). The clean theta bank lands
  # beside its ClassifierBank as <stem>.synthetic.h5 — no config needed.
  clean_intermediate: ../banks/synthegm_v1_clean_small_gd.classifier.h5
  # Optional explicit ids. `bank_id` names the MIXED pair (ClassifierBank
  # + its theta bank); `clean_intermediate_bank_id` names the CLEAN pair.
  # One override per pair — each keeps its own ClassifierBank and theta
  # bank in step, and neither can drift onto the other's artifacts.
  # bank_id: tbank_synthetic_aliev_panfilov_noise_mixed_2026-06-27
  # clean_intermediate_bank_id: tbank_synthetic_ap_clean_small_gd_2026-06-27
  description: >
    Phase 1 noise-mixed synthetic corpus — same clean dataset as baseline,
    overlaid with iafdb_noise_v1 at 10-25 dB per-trace SNR.

# Inline mixer block. Triggers the noise-mixed output path.
mix:
  # Noise bank produced by iafdb-pipeline; ships from the IAFDB noise-
  # extraction CLI. Resolve relative to this config file's directory.
  noise_bank: ../banks/iafdb_noise_v1.h5
  snr_db_range: [10.0, 25.0]               # uniform per-trace SNR; matches Sánchez 2021
  bandpass_clean: true                     # filter the clean to the clinical bipolar band before mixing
  band_hz: [30.0, 300.0]                   # 30 - 300 Hz; matches noise-extraction band
  master_seed: 0                           # mixer's own RNG seed (independent of simulator's)
  show_progress: true                      # tqdm bar over the mixer loop
  description: >
    Noise-mixed bank vs iafdb_noise_v1 at 10-25 dB SNR.
