# synthegm-mix — standalone mixer with v1 default settings.
#
# Reads a clean ClassifierBank (produced by ``synthegm-generate-dataset``
# without a ``mix:`` block, or by any other producer emitting the
# ClassifierBank format) and an iafdb-pipeline noise bank. Overlays
# noise per trace at the configured SNR distribution and writes a
# noise-mixed ClassifierBank.
#
# Pair this with ``synthegm_v1_baseline.yaml`` for the two-step
# clean-then-mix workflow:
#
#   synthegm-generate-dataset examples/synthegm_v1_baseline.yaml
#   synthegm-mix              examples/synthegm_mix.yaml
#
# Equivalent in one step: ``synthegm_v1_noise_mixed.yaml``.
#
# Output: ../banks/synthegm_v1_noise_mixed.classifier.h5

input:
  classifier_bank: ../banks/synthegm_v1_baseline.classifier.h5
  noise_bank:      ../banks/iafdb_noise_v1.h5
  # noise_bank_id: nbank_iafdb_2026-06-15  # optional; default reads the noise run-record sidecar

output:
  classifier_bank: ../banks/synthegm_v1_noise_mixed.classifier.h5
  # bank_id: tbank_synthetic_aliev_panfilov_noise_mixed_2026-06-27  # optional; auto-derived (_noise_mixed) when omitted

mixer:
  snr_db_range: [10.0, 25.0]               # uniform per-trace SNR; matches Sánchez 2021
  bandpass_clean: true                     # filter the clean to the clinical bipolar band before mixing
  band_hz: [30.0, 300.0]                   # 30 - 300 Hz; matches noise-extraction band
  master_seed: 0                           # mixer's RNG seed
  show_progress: true                      # tqdm bar; override with --no-progress
  description: >
    Noise-mixed bank vs iafdb_noise_v1 at 10-25 dB SNR.
