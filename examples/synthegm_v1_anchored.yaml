# synthegm-generate-dataset — v1 baseline, ANCHORED position arm.
#
# The fixed arm of the anchored-vs-varied A/B (SEP10, study §8.9). It is
# the same class as the varied arm with the range collapsed to a point:
# UniformPositionGenerator(0.5, 0.5) IS a fixed position, so switching arms
# is a value change, not a code path. A collapsed generator does not consume
# its random stream, so this arm is reproducible however the seed is set.
#
# Pair with synthegm_v1_baseline.yaml (p in [0.25, 0.75]) for the A/B.
#
# Project default for the Phase 1 synthetic training corpus: 100
# simulations × 20 bipolar pairs = 2,000 traces, fibrosis density
# sampled uniformly over [0, 0.5], local-density labelling at 2 mm /
# 0.1 threshold, no inline noise mixing. Pair with
# ``synthegm_v1_noise_mixed.yaml`` to add the IAFDB noise overlay in one
# run, or run ``synthegm-mix`` separately against the clean output.
#
# Output: ../banks/synthegm_v1_anchored.classifier.h5

dataset:
  n_simulations: 100                       # 100 sims × 20 pairs = 2000 traces
  master_seed: 42                          # reproducibility anchor; per-sim seeds derive from this
  show_progress: true                      # tqdm bar; override with --no-progress

backend:
  type: finitewave                         # Phase 1: only 'finitewave'
  # Membrane parameterisation: targets + solved knobs + what they
  # measured. Naming it here is what stops ap_time_unit_ms and
  # friends being restated (and going stale) in every config.
  model: af_remodelled_220ms

geometry:
  type: patch_2d                           # Phase 1: only 'patch_2d'
  size_mm: 40.0                            # 4 cm square (Sánchez 2021 patch scale)
  dr_mm: 0.25                              # 0.25 mm; Finitewave default for AP
  fiber_angle_rad: 0.0                     # fibers along +x
  anisotropy_ratio: 2.0                    # CV_along / CV_across; atrial WALL is ~2:1 (Hansson 1998)

substrate:
  type: uniform_random_fibrosis            # Phase 1: only uniform-random
  density_range: [0.0, 0.5]                # uniform; capped at 0.5 to stay below propagation failure
  fraction_healthy: 0.3                    # force 30% of sims to density=0 exactly for class balance

activation:
  type: planar_edge                        # Phase 1: only planar-edge
  fixed_edge: null                         # null = randomize per sim across all four edges

electrodes:
  type: centered_grid_2d                   # Phase 1: only centered-grid-2d
  n_rows: 5                                # 5 rows of 5 electrodes
  n_cols: 5                                # → 4 bipolar pairs per row × 5 rows = 20 pairs per sim
  spacing_mm: 2.0                          # 2 mm intra-row spacing; matches IAFDB CS pairs / PentaRay
  height_mm_range: [0.2, 1.0]              # per-sim height sampled uniformly; models contact-quality variation

label_policy:
  type: local_density                      # 'local_density' or 'global_density'
  radius_mm: 2.0                           # bipolar receptive field; pair midpoint + radius
  threshold: 0.1                           # local density > 0.1 → label 1 (fibrotic)
  healthy_name: healthy                    # surfaces in ClassifierBank.labels dict
  fibrotic_name: fibrotic

run:
  trace_duration_ms: 192.0                 # 192 = 3x64; T must be a multiple of 64 (MobileViT)
  output_fs_hz: 1000.0                     # matches IAFDB so synthetic + real are length-comparable
  capture_oversample: 4                    # backend captures at 4× output rate; runner downsamples

# Controlled-position cropping (SEP2). Omit this block for no cropping.
# `low` DRIVES how long the solver runs: a window placed early in its span
# needs signal after the activation, so the capture extends past the trace
# (T=192 with p_lo=0.25 -> 335 samples). The front is never extended — the
# trace starts when the stimulus fires — which is why `high` stays below 1.
activation_position:
  low: 0.5
  high: 0.5
  # seed: 7                                # default: dataset.master_seed

output:
  classifier_bank: ../banks/synthegm_v1_anchored.classifier.h5
  # No clean_intermediate here: without an inline mixer the classifier_bank
  # IS the clean bank, so there is nothing separate to persist.
  # bank_id: tbank_synthetic_aliev_panfilov_2026-06-27  # optional; auto-derived from cell model when omitted
  description: >
    Phase 1 baseline synthetic corpus — 100 sims, LocalDensityLabel(r=2mm, t=0.1),
    uniform density sweep with 30% forced-healthy. No noise overlay.

# No `mix:` block → write the clean ClassifierBank only.
