name: CI

on:
  push:
    branches: [development, release]
  pull_request:
    branches: [development, release]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml so local == CI. Unpinned, CI
        # resolved ruff 0.16, which formats Markdown code blocks and failed docs
        # that pre-commit had passed. Bump both together.
        run: pip install "ruff==0.15.17"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --cov --cov-report=xml --cov-report=term

      # The `slow` tests are deselected by default (pyproject `addopts`) so a
      # local run stays ~1 s. They are the ones that exercise the real
      # Finitewave backend end to end -- including the schema-migration
      # equivalence check -- so CI must not inherit that deselection, or the
      # gate silently never runs. finitewave is a hard runtime dep, so the
      # only added cost is the tests themselves.
      - name: Run pytest (slow — real Finitewave backend)
        run: pytest -m slow

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy
