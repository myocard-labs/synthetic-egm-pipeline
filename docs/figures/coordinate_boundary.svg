<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="DejaVu Sans, sans-serif" font-size="13">
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="17" font-weight="bold">The boundary: three things cross into Finitewave, two must swap</text>
  <text x="430" y="46" text-anchor="middle" font-size="12" fill="#555">Finitewave calls axis-0 "x". We call axis-1 "x". Anything expressed in PHYSICAL (x, y) flips.</text>

  <!-- our side -->
  <rect x="30" y="70" width="300" height="330" fill="#f4faf4" stroke="#1a6b1a" stroke-width="1.5"/>
  <text x="180" y="94" text-anchor="middle" font-weight="bold" fill="#1a6b1a">OUR SIDE — physical</text>
  <text x="180" y="114" text-anchor="middle" font-size="11">x = axis-1 (j),  y = axis-0 (i)</text>

  <!-- fw side -->
  <rect x="530" y="70" width="300" height="330" fill="#fdf6ec" stroke="#b35c00" stroke-width="1.5"/>
  <text x="680" y="94" text-anchor="middle" font-weight="bold" fill="#b35c00">FINITEWAVE — index</text>
  <text x="680" y="114" text-anchor="middle" font-size="11">"x" = axis-0 (i),  "y" = axis-1 (j)</text>

  <!-- crossing 1: electrodes -->
  <text x="180" y="160" text-anchor="middle" font-size="12" font-weight="bold">electrode positions_mm</text>
  <text x="180" y="178" text-anchor="middle" font-size="11" font-family="monospace">(x, y, z)</text>
  <path d="M 335 170 L 525 170" stroke="#c1272d" stroke-width="2.5" marker-end="url(#r)"/>
  <rect x="360" y="146" width="140" height="22" fill="#c1272d" opacity="0.12" stroke="#c1272d"/>
  <text x="430" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#c1272d">SWAP  (y, x, z)</text>
  <text x="680" y="176" text-anchor="middle" font-size="11" font-family="monospace">coords[0]↔i, coords[1]↔j</text>
  <text x="430" y="192" text-anchor="middle" font-size="10" fill="#666">fixed inside egm_kernel_2d</text>

  <!-- crossing 2: fibres -->
  <text x="180" y="248" text-anchor="middle" font-size="12" font-weight="bold">fiber_angle_rad</text>
  <text x="180" y="266" text-anchor="middle" font-size="11" font-family="monospace">theta measured from +x</text>
  <path d="M 335 258 L 525 258" stroke="#c1272d" stroke-width="2.5" marker-end="url(#r)"/>
  <rect x="360" y="234" width="140" height="22" fill="#c1272d" opacity="0.12" stroke="#c1272d"/>
  <text x="430" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#c1272d">SWAP  components</text>
  <text x="680" y="258" text-anchor="middle" font-size="11" font-family="monospace">[0]=sin θ, [1]=cos θ</text>
  <text x="430" y="280" text-anchor="middle" font-size="10" fill="#666">fixed inside _build_tissue_2d</text>

  <!-- crossing 3: stimulus -->
  <text x="180" y="336" text-anchor="middle" font-size="12" font-weight="bold">stimulus edge</text>
  <text x="180" y="354" text-anchor="middle" font-size="11" font-family="monospace">top / bottom / left / right</text>
  <path d="M 335 346 L 525 346" stroke="#1a6b1a" stroke-width="2.5" marker-end="url(#g2)"/>
  <rect x="360" y="322" width="140" height="22" fill="#1a6b1a" opacity="0.12" stroke="#1a6b1a"/>
  <text x="430" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a6b1a">NO SWAP</text>
  <text x="680" y="346" text-anchor="middle" font-size="11" font-family="monospace">mesh[x1:x2, y1:y2]</text>
  <text x="430" y="368" text-anchor="middle" font-size="10" fill="#666">already written in index space</text>

  <rect x="30" y="416" width="800" height="42" fill="#f5f5f5" stroke="#bbb"/>
  <text x="430" y="434" text-anchor="middle" font-size="12"><tspan font-weight="bold">The rule:</tspan> if a value is expressed in physical x/y it swaps; if it is already an array index it does not.</text>
  <text x="430" y="452" text-anchor="middle" font-size="12">The stimulus never needed fixing because "top" was always defined as a strip at low <tspan font-family="monospace">i</tspan>, not "low y".</text>

  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#c1272d"/></marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1a6b1a"/></marker>
  </defs>
</svg>
