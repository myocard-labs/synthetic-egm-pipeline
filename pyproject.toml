# ---------------------------------------------------------------------------
# pyproject.toml — myocard-synthetic-egm-pipeline
#
# Synthetic-side producer for the myocard-labs intracardiac-EGM stack.
# Finitewave-driven clean EGM simulation + additive noise mixing.
#
# A run writes TWO artifacts against TWO different schemas (this replaced
# the old clean/noise-mixed pair when synthetic_bank 2.0 landed in Wave 1):
#
#   - <name>.classifier.h5 : ClassifierBank — the ML training artifact
#                            (signal + int label), source-agnostic
#   - <name>.h5            : synthetic_bank — theta + the per-simulation
#                            generation config, joined on simulation_id
#
# All bank-writing goes through myocard-egm-data; this package owns the
# simulator orchestration, the pseudo-EGM math, and the mixer.
#
# Convention recap:
#   GitHub repo  : synthetic-egm-pipeline             (bare)
#   PyPI dist    : myocard-synthetic-egm-pipeline     (myocard- prefix)
#   Import name  : myocard_synthetic_egm_pipeline     (underscore)
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myocard-synthetic-egm-pipeline"
version = "0.3.0"
description = "Finitewave-driven synthetic intracardiac-EGM producer + additive-noise mixer. Writes synthetic_bank artifacts consumable by myocard-egm-classifier."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Daniel Klein", email = "daniel.anthony.klein.88@gmail.com" },
]
keywords = [
  "cardiac",
  "electrophysiology",
  "signal-processing",
  "egm",
  "intracardiac",
  "atrial-fibrillation",
  "finitewave",
  "synthetic-data",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Runtime deps. The bank-writing path is owned by myocard-egm-data; the
# schemas live in myocard-egm-contracts (and come in transitively via
# egm-data). h5py is NOT pulled in directly — egm-data carries it.
# Finitewave is a hard runtime dep — the entire purpose of this package
# is the simulator + mixer pipeline.
dependencies = [
  "myocard-egm-contracts @ git+https://github.com/myocard-labs/egm-contracts.git@v0.6.1",
  "myocard-egm-data @ git+https://github.com/myocard-labs/egm-data.git@v0.6.2",
  "myocard-egm-signal @ git+https://github.com/myocard-labs/egm-signal.git@v0.4.0",
  # pydantic is used directly to validate stable bank ids (ids.py); it
  # also arrives transitively via egm-contracts, but we import it by name
  # so we declare it.
  "pydantic>=2",
  # numpy is capped as a deliberate, fleet-wide exception to "never cap a
  # runtime dep" (CL-118, blessed by the project-lead): numpy 2.5 ships
  # PEP-695 generics in its stubs, which mypy cannot parse under
  # `python_version = "3.10"` — our floor. The cap is a type-checking
  # constraint, not a runtime one; lift it when the floor moves past 3.10.
  "numpy>=1.26,<2.5",
  "scipy>=1.10",
  "finitewave>=0.9",
  "tqdm>=4.65",
  # YAML is the project-wide config format (matches egm-classifier
  # and iafdb-pipeline).
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # ruff and mypy pinned to exact versions (matching the rest of the
  # myocard-labs stack) so local dev, CI, and the pre-commit hook all
  # run the same binary. Bumping ruff or mypy means updating this line,
  # .pre-commit-config.yaml, and ci.yml together.
  "ruff==0.15.17",
  "mypy==2.1.0",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
  # Type stubs for PyYAML so mypy strict-checks the config loader.
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage      = "https://github.com/myocard-labs/synthetic-egm-pipeline"
Repository    = "https://github.com/myocard-labs/synthetic-egm-pipeline"
Issues        = "https://github.com/myocard-labs/synthetic-egm-pipeline/issues"
Organization  = "https://github.com/myocard-labs"

[project.scripts]
synthegm-generate-dataset = "myocard_synthetic_egm_pipeline.cli.generate_dataset_cmd:main"
synthegm-mix              = "myocard_synthetic_egm_pipeline.cli.mix_cmd:main"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

# Hatchling refuses direct URL references in dependencies by default; we
# need it during pre-1.0 iteration so we can pin the egm-* siblings to git
# tags. Drop this once everything ships on (Test)PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myocard_synthetic_egm_pipeline"]
# Ship py.typed so downstream consumers (and CI mypy) can type-check
# imports from this package without an ignore-missing-imports override.
artifacts = [
  "src/myocard_synthetic_egm_pipeline/py.typed",
  # Shipped model cards. They are data, not code, so hatchling needs telling —
  # and a config that names a card must resolve it from an installed wheel, not
  # only from a source checkout.
  "src/myocard_synthetic_egm_pipeline/models/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

# Pin isort groups so local + CI agree on first-party vs third-party
# attribution.
[tool.ruff.lint.isort]
known-first-party = ["myocard_synthetic_egm_pipeline"]
known-third-party = [
  "myocard_egm_contracts",
  "myocard_egm_data",
  "myocard_egm_signal",
  "finitewave",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  # The suite runs against a MockBackend and finishes in ~1 s; the handful
  # of tests that spin up the real Finitewave solver are opt-in so that
  # stays true. Run them with `pytest -m slow`.
  #
  # `benchmark` needs its own exclusion and is NOT covered by "not slow".
  # Benchmarks are not slow-marked -- deliberately, because double-marking is
  # the leak path: CI runs the slow suite, and a test carrying both markers
  # would ride in on the marker it was not excluded by. So each selector names
  # both, here and in ci.yml.
  "-m", "not slow and not benchmark",
]
markers = [
  "slow: exercises the real Finitewave backend (seconds, not milliseconds)",
  # Wall-clock measurement, not a correctness gate. Run by hand when
  # benchmarking and before a PR that could move the numbers; NEVER in CI,
  # where a shared runner's timing says nothing about this code.
  "benchmark: measures runtime cost; run manually, never in CI",
]
filterwarnings = [
  "error",
  # finitewave / scipy occasionally surface harmless deprecation warnings;
  # let them through rather than crash the suite on third-party churn.
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/myocard_synthetic_egm_pipeline"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# Type-check tests as well as src (CL-100, fleet-wide convention). Strict
# mypy over a test suite catches real sloppiness — under-annotated helpers,
# bare dicts, unguarded optionals — and running `mypy` bare means CI and a
# local run check exactly the same files.
files = ["src", "tests"]

# finitewave + tqdm + scipy ship without complete inline stubs; ignore-
# missing silences these third-party hops without losing strict checking
# on our own code. myocard-egm-contracts, myocard-egm-data, and
# myocard-egm-signal all ship py.typed and are NOT in this override list.
#
[[tool.mypy.overrides]]
module = [
  "finitewave.*",
  "tqdm.*",
]
ignore_missing_imports = true

# scipy is imported directly by tests/test_antialias.py, which builds the
# causal filter that proves the production one is zero-phase. The production
# path reaches scipy only through egm-signal, which ships py.typed.
[[tool.mypy.overrides]]
module = [
  "scipy.*",
]
ignore_missing_imports = true
